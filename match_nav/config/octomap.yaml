# Octomap Server Configuration for 3D Mapping

octomap_server:
  ros__parameters:
    # Frame IDs
    frame_id: "map"

    # Resolution (voxel size in meters)
    resolution: 0.2

    # Sensor model parameters
    sensor_model:
      max_range: 30.0  # Max sensor range (meters)
      hit: 0.7         # Probability for occupied when hit
      miss: 0.4        # Probability for free when miss
      min: 0.12        # Min probability (clamping)
      max: 0.97        # Max probability (clamping)

    # Filtering options
    filter_ground: false  # Don't filter ground (drone needs it)
    ground_filter:
      distance: 0.04     # Distance threshold for ground plane
      angle: 0.15        # Angle threshold (radians)
      plane_distance: 0.07

    # Visualization
    height_map: false  # Don't project to 2D height map
    color_factor: 0.8  # Color attenuation (0-1)

    # Performance
    compress_map: true  # Compress map for publishing
    incremental_2D_projection: false  # Disable 2D projection

    # Publishing
    publish_free_space: false  # Only publish occupied voxels
    latch: true  # Latch map topic
