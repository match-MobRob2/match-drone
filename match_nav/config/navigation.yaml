# Navigation Configuration for Waypoint Following and Mission Management

waypoint_follower:
  ros__parameters:
    # Control loop frequency (Hz)
    control_frequency: 10.0

    # Waypoint thresholds
    waypoint_threshold: 0.3       # Distance to consider waypoint reached (meters)
    yaw_threshold: 0.1            # Yaw threshold (radians, ~5.7 degrees)

    # Velocity limits
    max_velocity: 2.0             # Max horizontal velocity (m/s)
    max_vertical_velocity: 1.0    # Max vertical velocity (m/s)
    max_yaw_rate: 0.5             # Max yaw rate (rad/s)

    # Collision avoidance
    collision_check_distance: 2.0  # Look-ahead distance (meters)
    collision_check_enabled: true  # Enable collision checking
    abort_on_collision: false      # Pause instead of abort

    # Timeout behavior
    waypoint_timeout: 30.0        # Max time per waypoint (seconds)
    stuck_threshold: 0.1          # Min movement to not be stuck (m/s)
    stuck_timeout: 5.0            # Time before declaring stuck (seconds)

    # Path following
    lookahead_distance: 1.0       # Look-ahead for trajectory following
    smooth_trajectory: true       # Apply trajectory smoothing

    # Status publishing
    status_publish_rate: 1.0      # Status update rate (Hz)

mission_manager:
  ros__parameters:
    # Planning behavior
    replan_on_failure: true       # Replan if planning fails
    max_replan_attempts: 3        # Max replanning attempts
    replan_timeout: 10.0          # Time between replanning attempts (seconds)

    # Execution monitoring
    monitor_execution: true       # Monitor waypoint follower status
    execution_timeout: 120.0      # Max execution time (seconds)

    # Navigation preferences
    planning_algorithm: "RRTstar"  # Global planner algorithm
    planning_timeout: 5.0         # Planning time limit (seconds)

    # Safety
    pre_flight_checks: true       # Run pre-flight checks
    min_battery_level: 0.2        # Min battery to start mission (0-1)
    emergency_land_on_error: false  # Emergency land vs hover on error

    # Mission logging
    log_missions: true            # Log mission execution
    log_path: "/tmp/match_nav"    # Log directory
